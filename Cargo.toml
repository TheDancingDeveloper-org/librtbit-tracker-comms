[package]
name = "librtbit-tracker-comms"
version = "0.1.0"
edition = "2024"
description = "HTTP and UDP tracker communication for the rtbit BitTorrent client"
license = "MIT"
repository = "http://100.92.54.45:3002/indexarr/librtbit-tracker-comms"

[dependencies]
tokio = "1"
anyhow = "1"
futures = "0.3"
async-stream = "0.3"
buffers = { git = "http://100.92.54.45:3002/indexarr/librtbit-buffers.git", tag = "v0.1.0", package = "librtbit-buffers" }
librtbit-core = { git = "http://100.92.54.45:3002/indexarr/librtbit-core.git", tag = "v0.1.0" }
bencode = { git = "http://100.92.54.45:3002/indexarr/librtbit-bencode.git", tag = "v0.1.0", package = "librtbit-bencode" }
byteorder = "1"
serde = "1"
serde_derive = "1"
urlencoding = "2"
rand = "0.9"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
url = { version = "2", default-features = false }
parking_lot = "0.12"
tokio-util = "0.7"
librqbit-dualstack-sockets = "0.7"
backon = "1.5"
itertools = "0.14"
serde_with = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused = "warn"
